<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Term Extractor Bilingual JSON Prompt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #020617;
      --card-bg: #0b1120;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --radius-lg: 18px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.6);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a 0, #020617 55%, #000 100%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 960px;
      width: 100%;
      background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(15,23,42,0.98));
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.26);
      padding: 22px 22px 20px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(56,189,248,0.08) 0, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(56,189,248,0.07) 0, transparent 60%);
      opacity: 0.8;
      pointer-events: none;
    }
    .card-inner { position: relative; z-index: 1; }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h1 span.badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 2px 10px 3px;
      border-radius: 999px;
      background: rgba(15,23,42,0.98);
      border: 1px solid rgba(148,163,184,0.5);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    h1 span.badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(56,189,248,0.8);
    }
    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      min-height: 440px;
      resize: vertical;
      background: radial-gradient(circle at top left, rgba(15,23,42,1), rgba(15,23,42,0.96));
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148,163,184,0.55);
      padding: 14px 13px 12px;
      color: var(--text-main);
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height: 1.4;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(15,23,42,0.9);
      caret-color: var(--accent);
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 1px rgba(15,23,42,0.9),
        0 0 0 1px rgba(56,189,248,0.5),
        0 0 40px rgba(56,189,248,0.15);
    }
    .copy-toast {
      position: absolute;
      inset-inline-end: 16px;
      inset-block-start: 16px;
      padding: 5px 11px 6px;
      font-size: 0.74rem;
      border-radius: 999px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(56,189,248,0.6);
      color: var(--accent);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease-out, transform 0.18s ease-out;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      z-index: 2;
    }
    .copy-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .copy-toast-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="copy-toast" id="copyToast">
      <span class="copy-toast-dot"></span>
      Prompt copied
    </div>
    <div class="card-inner">
      <h1>
        Term Extractor Prompt
        <span class="badge">
          <span class="badge-dot"></span>
          JSON • EN ⇄ 中文
        </span>
      </h1>
      <div class="subtitle">Double-click inside the text box to copy the entire prompt.</div>

      <textarea id="promptText" readonly>
You are an expert bilingual (English–Chinese) subject-matter tutor and term extractor.

YOUR GOAL
From the input TEXT CONTENT (which comes from a text file or a PDF file), extract only the terms/words that match the filter description I provide. Then output them in a single JSON array. For each term, include:
- English term, definition, explanation
- Chinese term, definition, explanation

Use the following JSON object shape for EACH term:

{
  "en_term": "characteristic",
  "en_def": "A feature or quality of an organism that can be observed; it may be determined by genes.",
  "en_exp": "Hairline shape and flower colour are characteristics that can be inherited.",
  "zh_term": "特征（characteristic）",
  "zh_def": "生物体具有的某种可观察的性质，通常由基因决定。",
  "zh_exp": "额发线形状、花的颜色等都属于可遗传的特征。"
}

INPUTS YOU WILL PROVIDE
1. FILTER DESCRIPTION  
   (Defines what kinds of terms to extract)

2. TEXT CONTENT  
   (The plain text extracted from a .txt file or a .pdf file)

You will give input in this structure:

=== FILTER DESCRIPTION ===
[Describe what to filter, for example:
 “Biology terms related to genes, heredity, and evolution”
 “Key terms from digital literacy”
 “Chemistry 11 atomic structure vocabulary”
]

=== TEXT CONTENT START ===
[Paste raw text extracted from a text file or PDF]
=== TEXT CONTENT END ===

INSTRUCTIONS

1. TERM SELECTION
   - Only select terms/words that clearly match the FILTER DESCRIPTION.
   - The term must actually appear in the TEXT CONTENT (minor variations allowed: plural/singular).
   - Prioritize academic/scientific/technical vocabulary.
   - Ignore generic words unless explicitly requested by the filter.

2. DEFINITIONS (en_def)
   - First use any definition explicitly present in the TEXT CONTENT.
   - If not stated, infer a correct definition based on context.
   - Keep definitions concise (1–2 sentences).

3. EXPLANATIONS (en_exp)
   - Provide a simple explanation or example to help understanding.
   - Must be consistent with the meaning and context of the term.

4. CHINESE PARTS (zh_term, zh_def, zh_exp)
   - zh_term should be “中文名称（English term）” when appropriate.
   - zh_def must be a faithful, natural translation of the English definition.
   - zh_exp should be a natural Chinese explanation of the English example/explanation.

5. JSON FORMAT
   - Output a SINGLE JSON ARRAY containing ALL extracted term objects.
   - Do NOT split into batches.
   - Do NOT add extra text outside the JSON.
   - JSON must be strictly valid.

EXAMPLE JSON STRUCTURE (FORMAT ONLY — DO NOT REPEAT):

[
  {
    "en_term": "characteristic",
    "en_def": "A feature or quality...",
    "en_exp": "For example...",
    "zh_term": "特征（characteristic）",
    "zh_def": "……",
    "zh_exp": "……"
  }
]

NOW, using the FILTER DESCRIPTION and TEXT CONTENT I provide, output ONLY the JSON array. No explanations.
      </textarea>
    </div>
  </div>

  <script>
    (function () {
      const textarea = document.getElementById("promptText");
      const toast = document.getElementById("copyToast");

      function selectAll() {
        textarea.focus();
        textarea.select();
      }

      async function copyPrompt() {
        selectAll();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(textarea.value);
          }
        } catch (e) {}
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1400);
      }

      textarea.addEventListener("dblclick", copyPrompt);
    })();
  </script>
</body>
</html>
